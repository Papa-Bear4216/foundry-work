name: CI

on: [push]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install pinned Gitleaks
        shell: pwsh
        run: |
          $version = '8.28.0'
          if ($IsWindows) {
            $asset = "gitleaks_${version}_windows_x64.zip"
            $sha256 = 'da6458e8864af553807de1c46a7a8eac0880bd6b99ba56288e87e86a45af884f'
          } else {
            $asset = "gitleaks_${version}_linux_x64.tar.gz"
            $sha256 = 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb'
          }

          $toolDir = Join-Path $env:RUNNER_TEMP 'gitleaks'
          New-Item -ItemType Directory -Path $toolDir | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest "https://github.com/gitleaks/gitleaks/releases/download/v$version/$asset" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive).Hash -ne $sha256) {
            throw 'Gitleaks archive checksum mismatch.'
          }

          if ($IsWindows) {
            Expand-Archive -LiteralPath $archive -DestinationPath $toolDir
          } else {
            tar -xzf $archive -C $toolDir gitleaks
            if ($LASTEXITCODE -ne 0) { throw 'Gitleaks extraction failed.' }
          }
          $toolDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install workspace
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Identifier scan
        run: npm run check:identifiers
      - name: License check
        if: ${{ !cancelled() }}
        run: npm run check:licenses
      - name: Runtime dependency check
        if: ${{ !cancelled() }}
        run: npm run check:runtime-dependencies
      - run: npm run typecheck
      - run: npm run build
      - name: Load the built JavaScript
        run: node --input-type=module -e "await import('facts-ledger')"
      # Step Zero 10.1, 10.2: the 50-case gate and citation checker must match expected.txt exactly.
      - name: Tests and deterministic gate (serial)
        run: npm test --workspace facts-ledger
      # Step Zero 10.4: memory, time, digest size and token accounting on the 10,000-block fixture.
      - name: Budgets (pinned runtime)
        if: ${{ !cancelled() }}
        run: npm run budgets --workspace facts-ledger

  vault-format:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verify the vault format vectors
        shell: pwsh
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r packages/vault/reference/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix packages/vault/codec run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix packages/vault/codec run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --input-type=module -e "await import('./packages/vault/codec/dist/index.js')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix packages/vault/codec run vectors -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix packages/vault/codec test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B packages/vault/reference/test_vectors.py
      - name: Vault key command peak RSS (pinned runtime)
        run: npm --prefix packages/vault/codec run budgets
      - name: Vault append, close and verification peak RSS (pinned runtime)
        run: npm --prefix packages/vault/codec run vault-budgets
      - name: Vault replay and streamed blob peak RSS (pinned runtime)
        run: npm --prefix packages/vault/codec run replay-budgets
      - name: Vault unlock session peak RSS (pinned runtime)
        run: npm --prefix packages/vault/codec run session-budgets

  v0-measure:
    concurrency:
      group: v0-measure-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install V-0 measurement dependencies
        run: npm ci --prefix benchmarks/v0 --ignore-scripts --no-audit --no-fund

      - name: Build SQLCipher native addon from source
        working-directory: benchmarks/v0/node_modules/better-sqlite3-multiple-ciphers
        run: npx --yes node-gyp@13.1.0 rebuild --release --force_build=1

      - name: Run V-0 measurements
        env:
          FOUNDRY_V0_REQUIRE_BUILT: "1"
        run: node benchmarks/v0/run-all.mjs

  working-index:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install workspace and packaged native addon
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build working index
        run: npm run build --workspace foundry-index
      - name: Verify installed x64 prebuild loads on pinned Node
        run: node packages/index/test/prebuild-check.mjs
      - name: Working index tests (serial)
        run: npm test --workspace foundry-index
      - name: Working index peak RSS
        run: npm run budgets --workspace foundry-index

  importers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install workspace
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build vault codec and importers
        shell: pwsh
        run: |
          npm --prefix packages/vault/codec run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --workspace importers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --input-type=module -e "await import('importers')"
      - name: Importer test suites (serial)
        run: npm test --workspace importers
      - name: Importer 1 GiB mbox peak RSS budget (pinned runtime)
        if: ${{ !cancelled() }}
        run: npm run budgets --workspace importers
